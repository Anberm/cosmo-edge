version: 2
name: safety-helmet-detector-fps-gradient
displayName: Safety-helmet detector 24/10/7/5 FPS staircase
sampleIntervalSec: 3

channels:
  mode: local
  repeatCount: 0
  sources:
    - name: public-1080p24-sample
      file: "../../dataset/Safety Helmet.mp4"

tasks:
  - id: safety-helmet-detector
    displayName: Safety-helmet detector
    type: cv
    modelRefs:
      - "../../models/<platform>.json#person-detector"
      - "../../models/<platform>.json#safety-helmet-classifier"
    targetFps: "<24|10|7|5>"

bindings:
  - task: safety-helmet-detector
    channels: all

loadProfile:
  - channels: "1..<platform-maximum>"
    holdSec: "<platform-hold-seconds>"

thresholds:
  pass:
    avgDiscardRate: 0.05
  taskTypes:
    cv:
      minFpsRatio: 0.8
      maxMissingRate: 0
