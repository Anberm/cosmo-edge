version: 2
name: vlm-0p1fps-runtime-observation
displayName: VLM 0.1 FPS per-channel runtime observation
sampleIntervalSec: 10

channels:
  mode: local
  repeatCount: 0
  sources:
    - name: public-1080p24-sample
      file: "../../dataset/Safety Helmet.mp4"

tasks:
  - id: vlm-observation
    displayName: Vision-language model observation
    type: vlm
    modelRef: "../../models/<platform>.json#vlm"
    targetFps: 0.1

bindings:
  - task: vlm-observation
    channels: all

loadProfile:
  - channels: 1
    holdSec: 120
  - channels: 2
    holdSec: 120
  - channels: 3
    holdSec: 120
  - channels: 4
    holdSec: 120
  - channels: 5
    holdSec: 120
  - channels: 6
    holdSec: 120
  - channels: 7
    holdSec: 120
  - channels: 8
    holdSec: 120

thresholds:
  pass:
    avgDiscardRate: 0.05
  taskTypes:
    vlm:
      minFpsRatio: null
      maxMissingRate: 0

# Analysis FPS is observed but deliberately excluded from PASS/FAIL in this
# historical evidence. Results must be labelled Experimental runtime observation,
# never validated VLM capacity or an official supported-channel claim.
