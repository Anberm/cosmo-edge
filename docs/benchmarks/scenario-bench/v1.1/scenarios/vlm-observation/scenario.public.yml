version: 2
name: vlm-0p1fps-current-route-observation
displayName: VLM 0.1 FPS current-route runtime observation
sampleIntervalSec: 3

channels:
  mode: local
  repeatCount: 0
  sources:
    - name: public-1080p24-sample
      file: "../../dataset/controlled-1080p24-sample.mp4"

tasks:
  - id: vlm-observation
    displayName: Vision-language model observation
    type: vlm
    modelRef: "../../models/<platform>.json#vlm"
    targetFps: 0.1

bindings:
  - task: vlm-observation
    channels: all

loadProfile:
  - channels: 1
    holdSec: 60
  - channels: 2
    holdSec: 60
  - channels: 3
    holdSec: 60
  - channels: 4
    holdSec: 60
  - channels: 5
    holdSec: 60
  - channels: 6
    holdSec: 60
  - channels: 7
    holdSec: 60
  - channels: 8
    holdSec: 60

thresholds:
  pass:
    avgDiscardRate: 0.05
  taskTypes:
    vlm:
      minFpsRatio: null
      maxMissingRate: 0

# Analysis FPS is observed but deliberately excluded from PASS/FAIL. The current
# tool waits for each newly added route to complete task-local inference and
# expose direct Qwen latency before formal sampling. Results must remain labelled
# Experimental runtime observation, never validated VLM capacity or an official
# supported-channel claim.
