version: 2
name: dual-detector-5fps-staircase
displayName: Dual-detector 5 FPS per channel staircase
sampleIntervalSec: 3

channels:
  mode: local
  repeatCount: 0
  sources:
    - name: public-1080p24-sample
      file: "../../dataset/Safety Helmet.mp4"

tasks:
  - id: person-detector
    displayName: Person detector
    type: cv
    modelRef: "../../models/<platform>.json#person-detector"
    targetFps: 5
  - id: safety-helmet-detector
    displayName: Safety-helmet detector
    type: cv
    modelRef: "../../models/<platform>.json#safety-helmet-classifier"
    targetFps: 5

bindings:
  - task: person-detector
    channels: all
  - task: safety-helmet-detector
    channels: all

thresholds:
  pass:
    avgDiscardRate: 0.05
  taskTypes:
    cv:
      minFpsRatio: 0.8
      maxMissingRate: 0

loadProfile:
  # Use the platform-specific step duration recorded in results/*/summary.json.
  - channels: "1..<platform-maximum>"
    holdSec: "<platform-hold-seconds>"

# This public descriptor is deliberately device-resolved at execution time.
# Internal algorithm and schedule identifiers are not part of the public identity.
