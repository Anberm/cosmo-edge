name: Transitional Rockchip Builder Publisher

# This path already exists on the default branch, so it can bootstrap the first
# publication of the replacement workflow from a feature ref. Remove this thin
# caller after the shared image digest has been published and pinned.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  rockchip:
    uses: ./.github/workflows/ci-build-rockchip.yml
    permissions:
      contents: read
      packages: write
